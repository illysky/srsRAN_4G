// Test-only NB-IoT carrier description for nbiot_sib_pack / the ctest suite.
// Mirrors the structure of the deployment's enb_nbiot.conf (kept in the deploy repo) but carries no site secrets.
nbiot = {
  lte     = { n_prb = 25; pci = 1; nof_ports = 1; cfi = 3; dl_earfcn = 6300; };
  carrier = { operation_mode = "inband_same_pci"; nbiot_prb = 17; n_id_ncell = 1; nof_ports = 1; };
  cell    = { mcc = "234"; mnc = "01"; tac = 0x0001; cell_id = 0x019B01; band = 20;
              cell_barred = false; intra_freq_reselection = true; q_rx_lev_min = -70; };
  mib     = { sched_info_sib1 = 0; sys_info_tag = 0; ac_barring = false; };
  sib1    = { si_window_length = 160; si_radio_frame_offset = 1; nrs_crs_power_offset = 0;
              eutra_control_region_size = 3;
              sched_info = ( { si_periodicity = 1024; si_repetition_pattern = 4; si_tb = 208; sib_mapping = [ ]; } ); };

  sib2 = {
    rach = {
      preamble_trans_max_ce         = 10;
      preamble_init_rx_target_power = -104;  // dBm; same as the live LTE cell (sib.conf preamble_init_rx_target_pwr)
      power_ramping_step            = 2;     // dB
      ra_response_window            = 10;    // ra-ResponseWindowSize, in NPDCCH search-space periods
      mac_contention_timer          = 8;     // in NPDCCH search-space periods
    };

    // NPRACH: what the UE transmits Msg1 on. The Phase 2 detector must be configured from exactly these values.
    nprach = {
      cp_length_us                 = 66.7;   // 66.7 = preamble format 0, 266.7 = format 1
      periodicity_ms               = 640;
      start_time_ms                = 8;
      subcarrier_offset            = 0;      // first 3.75 kHz subcarrier of the NPRACH region
      nof_subcarriers              = 12;     // 12, 24, 36 or 48
      nof_ce_levels                = 1;      // only 1 is implemented
      msg3_subcarrier_range_start  = "one";  // zero | oneThird | twoThird | one
      max_preamble_attempts        = 10;     // maxNumPreambleAttemptCE
      num_repetitions_per_preamble = 8;
      npdcch_num_repetitions_ra    = 8;      // Rmax of the Type-2 common search space
      npdcch_start_sf_css_ra       = 2;      // search-space period = this x Rmax subframes
      npdcch_offset_ra             = "zero"; // zero | oneEighth | oneFourth | threeEighth
    };

    pcch = {
      default_paging_cycle_rf       = 1024;  // RADIO FRAMES (128/256/512/1024), i.e. 10.24 s
      nB                            = "oneT";
      npdcch_num_repetitions_paging = 8;
    };

    npdsch = {
      // Reference power of one NRS RE. The UE computes path loss as (this - measured NRSRP) and sets its NPRACH
      // power from it, so a wrong value makes every UE transmit that many dB too loud or too quiet.
      // PLACEHOLDER: measure the NRS EPRE at the antenna port (in-band: LTE CRS EPRE + sib1.nrs_crs_power_offset).
      nrs_power_dbm = -20;
    };

    npusch = {
      ack_nack_num_repetitions_msg4 = 1;
      group_hopping_enabled         = false;
      group_assignment_npusch       = 0;
      // DMRS base sequence / cyclic shift are not signalled: the UE derives them from the cell id.
    };

    ul_power_control = {
      p0_nominal_npusch   = -85;   // dBm
      alpha               = 0.7;
      delta_preamble_msg3 = 6;     // dB
    };

    ue_timers = {
      t300 = 2500;   // ms
      t301 = 2500;
      t310 = 1000;
      n310 = 1;
      t311 = 30000;
      n311 = 1;
    };

    time_alignment_timer = "infinity";
  };
};
